<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    :root{
      --bg:#F4F6FB; --surface:#FFFFFF; --border:#E2E7F1;
      --text:#151B2E; --text-muted:#5C6685; --text-faint:#8B95B3;
      --primary:#2F55E8; --primary-tint:#EAEFFF;
      --danger:#D64545; --danger-bg:#FDECEC; --danger-border:#F3B6B6;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:'Noto Sans KR', -apple-system, sans-serif;}
  </style>
</helmet>
<div style="width:1160px; height:800px; background:var(--bg); display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:#FDECEC; border-bottom:1px solid #F3B6B6;">
    <span style="font-size:12px; font-weight:700; color:#B23A3A;">예외 상태 목업 — S3. 데이터 준비 실패 (문항/카테고리 없음 · 503)</span>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:64px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:28px;height:28px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 4h13M6 4v16M6 11h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-weight:700; font-size:16.5px; color:var(--text); letter-spacing:-0.2px;">FinMATE</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-size:13px; color:var(--text-muted);">사용자A 님</span>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center; font-weight:700;font-size:13px;color:var(--primary);">A</div>
    </div>
  </div>

  <div style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div style="width:460px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px;">
      <div style="width:72px; height:72px; border-radius:50%; background:var(--danger-bg); border:1.5px solid var(--danger-border); display:flex; align-items:center; justify-content:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 3l10 18H2L12 3z" stroke="#D64545" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="10" x2="12" y2="14" stroke="#D64545" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="#D64545"/></svg>
      </div>
      <div style="font-weight:700; font-size:19px; color:var(--text);">진단 문항을 불러올 수 없습니다</div>
      <div style="font-size:13.5px; color:var(--text-muted); line-height:1.7;">문항 데이터가 아직 준비되지 않았습니다.<br/>답변하신 내용은 유지되며, 잠시 후 다시 시도해 주세요.</div>
      <button style="padding:13px 32px; border-radius:10px; background:var(--primary); color:#fff; font-weight:700; font-size:14px; border:none; font-family:'Noto Sans KR',sans-serif;">다시 시도</button>
      <div style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">오류가 계속되면 잠시 후 다시 접속해 주세요. (내부 오류 상세는 표시되지 않습니다)</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
