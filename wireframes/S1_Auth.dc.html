<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    :root{
      --bg:#F4F6FB; --surface:#FFFFFF; --border:#E2E7F1;
      --text:#151B2E; --text-muted:#5C6685; --text-faint:#8B95B3;
      --primary:#2F55E8; --primary-dark:#1E3FC4; --primary-tint:#EAEFFF;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:'Noto Sans KR', -apple-system, sans-serif;}
    a{color:var(--primary); text-decoration:none;}
    a:hover{color:var(--primary-dark);}
    .field-label{font-size:13px; font-weight:500; color:var(--text); margin-bottom:6px; display:block;}
    .field-input{width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border); font-size:14px; font-family:'Noto Sans KR',sans-serif; color:var(--text); background:#fff;}
    .field-input::placeholder{color:var(--text-faint);}
  </style>
</helmet>
<div style="width:1160px; height:800px; background:var(--bg); display:flex;">

  <!-- left brand panel -->
  <div style="width:440px; height:100%; background:linear-gradient(155deg,#16224D 0%, #1E3FC4 65%, #2F55E8 100%); padding:56px 44px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;">
    <svg width="360" height="360" viewBox="0 0 360 360" style="position:absolute; right:-120px; bottom:-100px; opacity:0.35;"><circle cx="180" cy="180" r="179" stroke="#ffffff" stroke-width="1"/><circle cx="180" cy="180" r="130" stroke="#ffffff" stroke-width="1"/><circle cx="180" cy="180" r="80" stroke="#ffffff" stroke-width="1"/></svg>
    <div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px;height:32px;border-radius:9px;background:#ffffff;display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 4h13M6 4v16M6 11h9" stroke="#2F55E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span style="font-weight:900; font-size:20px; color:#ffffff; letter-spacing:-0.2px;">FinMATE</span>
      </div>
      <div style="margin-top:28px; font-weight:700; font-size:26px; color:#ffffff; line-height:1.4;">AI가 분석하는 나의<br/>투자 성향, 근거 있는<br/>탐색까지</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px; z-index:1;">
      <div style="display:flex; gap:10px; align-items:flex-start;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-top:2px; flex-shrink:0;"><path d="M5 13l4 4L19 7" stroke="#BFD0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:13.5px; color:#DCE4FF; line-height:1.5;">5문항 진단으로 5단계 투자 성향 확인</span>
      </div>
      <div style="display:flex; gap:10px; align-items:flex-start;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-top:2px; flex-shrink:0;"><path d="M5 13l4 4L19 7" stroke="#BFD0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:13.5px; color:#DCE4FF; line-height:1.5;">AI가 생성하는 근거 문장으로 쉽게 이해</span>
      </div>
      <div style="display:flex; gap:10px; align-items:flex-start;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-top:2px; flex-shrink:0;"><path d="M5 13l4 4L19 7" stroke="#BFD0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:13.5px; color:#DCE4FF; line-height:1.5;">내부 위험 필터를 통과한 카테고리·상품 탐색</span>
      </div>
      <div style="font-size:11.5px; color:#9FB4EE; margin-top:6px;">본 서비스는 투자 자문·투자 권유가 아닌 탐색 정보 제공 서비스입니다.</div>
    </div>
  </div>

  <!-- right form panel -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;">
    <div style="width:360px; display:flex; flex-direction:column; gap:26px;">
      <div style="display:flex; gap:0; border-bottom:1.5px solid var(--border);">
        <div style="padding:0 0 14px 0; margin-right:28px; font-weight:700; font-size:15px; color:var(--primary); border-bottom:2.5px solid var(--primary); margin-bottom:-1.5px;">로그인</div>
        <div style="padding:0 0 14px 0; font-weight:500; font-size:15px; color:var(--text-faint);">회원가입</div>
      </div>

      <div>
        <label class="field-label">이메일</label>
        <input class="field-input" placeholder="you@example.com" />
      </div>
      <div>
        <label class="field-label">비밀번호</label>
        <input class="field-input" placeholder="••••••••" />
      </div>

      <button style="width:100%; padding:14px; border-radius:10px; background:var(--primary); color:#fff; font-weight:700; font-size:15px; border:none; font-family:'Noto Sans KR',sans-serif;">로그인</button>

      <div style="text-align:center; font-size:13px; color:var(--text-muted);">계정이 없으신가요? <a href="#">회원가입</a></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
