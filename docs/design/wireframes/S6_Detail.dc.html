<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    :root{
      --bg:#F4F6FB; --surface:#FFFFFF; --border:#E2E7F1;
      --text:#151B2E; --text-muted:#5C6685; --text-faint:#8B95B3;
      --primary:#2F55E8; --primary-dark:#1E3FC4; --primary-tint:#EAEFFF;
      --amber-tint:#FEF3E1; --warn-bg:#FFF7E8; --warn-border:#F0C86E; --warn-text:#8A5A00;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:'Noto Sans KR', -apple-system, sans-serif;}
    a{color:var(--primary); text-decoration:none;}
  </style>
</helmet>
<div style="width:1160px; height:800px; background:var(--bg); display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 40px; height:64px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:28px;height:28px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 4h13M6 4v16M6 11h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-weight:700; font-size:16.5px; color:var(--text); letter-spacing:-0.2px;">FinMATE</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="font-size:13px; color:var(--text-muted);">사용자A 님</span>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center; font-weight:700;font-size:13px;color:var(--primary);">A</div>
    </div>
  </div>

  <div style="padding:22px 40px 0;">
    <div style="font-size:12.5px; color:var(--text-faint);">분석 결과 &nbsp;›&nbsp; 탐색 카테고리 &nbsp;›&nbsp; <span style="color:var(--text); font-weight:600;">상품 상세</span></div>
    <a href="#" style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-top:14px; width:fit-content;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#2F55E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      목록으로
    </a>
  </div>

  <div style="flex:1; display:flex; justify-content:center; padding:22px 40px 34px;">
    <div style="width:640px; display:flex; flex-direction:column; gap:20px;">

      <div style="background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="padding:4px 10px; border-radius:999px; background:var(--primary-tint); color:var(--primary); font-size:11.5px; font-weight:700;">혼합형 펀드</div>
          <div style="padding:4px 10px; border-radius:999px; background:var(--amber-tint); color:var(--warn-text); font-size:11.5px; font-weight:700;">위험등급 3등급</div>
        </div>
        <div style="font-weight:700; font-size:22px; color:var(--text); line-height:1.4;">국내 채권혼합형 펀드 (예시)</div>
        <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#5C6685" stroke-width="1.7"/><path d="M12 7v5l3.2 2" stroke="#5C6685" stroke-width="1.7" stroke-linecap="round"/></svg>
          예상 투자 기간: 1~3년
        </div>
      </div>

      <div style="background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:10px;">
        <div style="font-weight:700; font-size:14.5px; color:var(--text);">상품 설명</div>
        <div style="font-size:13.5px; color:var(--text-muted); line-height:1.7;">채권 비중을 높게 유지하면서 주식 일부를 편입합니다.</div>
      </div>

      <div style="background:var(--warn-bg); border:1.5px solid var(--warn-border); border-radius:14px; padding:20px 22px; display:flex; gap:12px; align-items:flex-start;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:1px;"><path d="M12 3l10 18H2L12 3z" stroke="#8A5A00" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="10" x2="12" y2="14" stroke="#8A5A00" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="#8A5A00"/></svg>
        <div style="font-size:12.5px; color:var(--warn-text); line-height:1.7;">본 정보는 투자 참고용이며 투자 자문이나 투자 권유가 아닙니다. 투자 판단의 최종 책임은 투자자 본인에게 있으며, 금융투자상품은 원금 손실이 발생할 수 있습니다.</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
