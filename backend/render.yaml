# Render 배포 블루프린트.
# 사용법: Render 대시보드 → New → Blueprint → 이 저장소 연결 → 이 파일을 자동 인식.
# DB는 Supabase Postgres를 쓰므로 Render의 managed Postgres는 만들지 않는다.
#
# 배포 전 Render 대시보드에서 아래 환경변수를 직접 채워야 한다 (Secret이라 여기 값을 못 둠):
#   SPRING_DATASOURCE_URL      예: jdbc:postgresql://<supabase-host>:5432/postgres
#   SPRING_DATASOURCE_USERNAME 예: postgres
#   SPRING_DATASOURCE_PASSWORD Supabase 프로젝트 생성 시 발급된 DB 비밀번호
#   ANTHROPIC_API_KEY          (선택) 없으면 자동으로 템플릿 설명으로 동작

services:
  - type: web
    name: finmate-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/product-categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
