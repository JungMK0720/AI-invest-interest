              questionId: { type: string }
              selectedIndex: { type: integer, minimum: -1, example: 1 }

    QuizChoice:
      type: object
      required: [id, text]
      properties:
        id: { type: string, example: bond-duration-q1-choice-1 }
        text: { type: string }

    QuizGradeResponse:
      type: object
      properties:
        slug: { type: string, example: bond-duration }
        total: { type: integer, example: 3 }
        correctCount: { type: integer, example: 2 }
        score: { type: integer, minimum: 0, maximum: 100, example: 67 }
        scorePercent: { type: integer, minimum: 0, maximum: 100, example: 67 }
        contentVersion: { type: string, example: learning-v2 }
        summary: { type: string, example: 금리와 채권 가격의 반대 방향 관계를 다시 확인해 보세요. }
        items: { type: array, items: { type: object } }

    QuizAttemptRequest:
      type: object
      required: [contentVersion, answers]
      properties:
        contentVersion: { type: string, example: learning-v2 }
        answers:
          type: array
          items:
            type: object
            required: [questionId, choiceId]
            properties:
              questionId: { type: string, example: bond-duration-q1 }
              choiceId: { type: string, example: bond-duration-q1-choice-1 }

    QuizAttemptResponse:
      type: object
      properties:
        slug: { type: string, example: bond-duration }
        total: { type: integer, example: 3 }
        answered: { type: integer, example: 3 }
        correctCount: { type: integer, example: 2 }
        scorePercent: { type: integer, example: 67 }
        contentVersion: { type: string, example: learning-v2 }
        items: { type: array, items: { type: object } }
        summary: { type: string }
        notice: { type: string }

    SimulationScenario:
      type: object
      properties:
        id: { type: string, example: bond-rate-shock }
        title: { type: string, example: 금리 변화와 채권 가격 }
        question: { type: string }
        summary: { type: string }
        mechanism: { type: string }
        conceptSlugs: { type: array, items: { type: string } }
        inputs: { type: array, items: { type: object } }
        randomised: { type: boolean, example: false }
        notice: { type: string }

    SimulationListResponse:
      type: object
      properties:
        scenarios: { type: array, items: { $ref: '#/components/schemas/SimulationScenario' } }
        notice: { type: string }

    SimulationRunRequest:
      type: object
      properties:
        inputs: { type: object, additionalProperties: { type: string } }
        seed: { type: integer, example: 42 }

    SimulationResult:
      type: object
      properties:
        scenarioId: { type: string, example: bond-rate-shock }
        title: { type: string }
        headline: { type: string }
        metrics: { type: array, items: { type: object } }
        series: { type: array, items: { type: object } }
        tables: { type: array, items: { type: object } }
        echo: { type: object, additionalProperties: { type: string } }
        seed: { type: integer, example: 42 }
        assumptions: { type: array, items: { type: string } }
        lessons: { type: array, items: { type: string } }
        notice: { type: string }

    PracticeProduct:
      type: object
      properties:
        id: { type: string, example: bond-basket }
        name: { type: string, example: 채권 바구니(가상) }
        assetClass: { type: string, example: BOND }
        mechanism: { type: string, example: coupon-rate-duration }
        driver: { type: string, example: 금리 }
        duration: { type: number, example: 5 }
        annualFeePercent: { type: number, example: 0.5 }
        leverage: { type: number, example: 1 }
        foreignCurrency: { type: boolean, example: false }
