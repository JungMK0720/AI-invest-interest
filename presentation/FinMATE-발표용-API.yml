        notice: { type: string }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: bond-duration-q1 }
              prompt: { type: string }
              difficulty: { type: string, example: BEGINNER }
              options: { type: array, items: { type: string } }
              choices: { type: array, items: { $ref: '#/components/schemas/QuizChoice' } }

    QuizGradeRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, selectedIndex]
