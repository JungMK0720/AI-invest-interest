        linearExposureRatio: { type: number, example: 1.2 }
        optionPremium: { type: number, example: 30000 }
        allocation: { type: array, items: { type: object } }
        positions: { type: array, items: { type: object } }
        lessons: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }

    PracticeComparison:
      type: object
      properties:
        before: { $ref: '#/components/schemas/PracticeAnalysis' }
        after: { $ref: '#/components/schemas/PracticeAnalysis' }
        profitLossDifference: { type: number, example: 125000 }
        interpretation: { type: string }
