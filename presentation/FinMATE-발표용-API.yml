        explanation: { type: string }

    PracticeScenario:
      type: object
      properties:
        id: { type: string, example: rate-up }
        name: { type: string, example: 시장금리 상승 }
        shocks: { type: object }

    Methodology:
      type: object
      properties:
        modelVersion: { type: string, example: portfolio-shock-v1 }
        label: { type: string, example: 실제 시세 없이 사용자가 정한 충격으로 계산하는 교육 실험 }
        assumptions: { type: array, items: { type: string } }
        sources: { type: array, items: { type: object } }

    PracticeHolding:
      type: object
      required: [rowId, productId, label, amount, annualFeePercent, duration, leverage, strike, premium, borrowingRatePercent]
      properties:
        rowId: { type: string, example: row-1 }
        productId: { type: string, example: bond-basket }
        label: { type: string, example: 채권 바구니 }
        amount: { type: number, minimum: 1000, example: 4000000 }
        annualFeePercent: { type: number, minimum: 0, maximum: 5, example: 0.5 }
        duration: { type: number, minimum: 0.1, maximum: 20, example: 5 }
        leverage: { type: number, minimum: 1, maximum: 20, example: 1 }
        strike: { type: number, minimum: 10, maximum: 200, example: 100 }
        premium: { type: number, minimum: 0.1, maximum: 100, example: 3 }
        borrowingRatePercent: { type: number, minimum: 0, maximum: 20, example: 4 }

    PracticeShocks:
      type: object
      properties:
        equityPercent: { type: number, minimum: -80, maximum: 100, example: -10 }
        ratePoints: { type: number, minimum: -2, maximum: 2, example: 1 }
        creditSpreadPoints: { type: number, minimum: -2, maximum: 3, example: 0.5 }
        goldPercent: { type: number, minimum: -80, maximum: 100, example: 5 }
        realEstatePercent: { type: number, minimum: -80, maximum: 100, example: -3 }
        fxPercent: { type: number, minimum: -50, maximum: 100, example: 3 }
        days: { type: integer, minimum: 1, maximum: 365, example: 30 }

    PracticePortfolio:
      type: object
      required: [budget, holdings]
      properties:
        budget: { type: number, minimum: 1000, example: 10000000 }
        holdings:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PracticeHolding' }

    PracticeAnalyzeRequest:
      type: object
      required: [portfolio, shocks]
      properties:
        portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        shocks: { $ref: '#/components/schemas/PracticeShocks' }

    PracticeCompareRequest:
      type: object
      required: [before, after, shocks]
      properties:
        before: { $ref: '#/components/schemas/PracticePortfolio' }
        after: { $ref: '#/components/schemas/PracticePortfolio' }
        shocks: { $ref: '#/components/schemas/PracticeShocks' }

    PracticeAnalysis:
      type: object
      properties:
        modelVersion: { type: string, example: practice-v1 }
        budget: { type: number, example: 10000000 }
        unallocatedCash: { type: number, example: 0 }
        endingValue: { type: number, example: 9650000 }
