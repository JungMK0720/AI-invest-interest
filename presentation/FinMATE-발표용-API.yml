        hasSimulation: { type: boolean, example: true }
        quizCount: { type: integer, example: 3 }
        descendantCount: { type: integer, example: 5 }
        children:
          type: array
          items: { $ref: '#/components/schemas/LearningNode' }

    LearningConcept:
      type: object
      properties:
        slug: { type: string, example: bond-duration }
        title: { type: string, example: 듀레이션 }
        summary: { type: string }
        explanation:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        diagramKey: { type: string, example: bond-rate-price }
        sourceUrl: { type: string, format: uri }

    LearningConceptDetail:
      allOf:
        - $ref: '#/components/schemas/LearningConcept'
        - type: object
          properties:
            explanation: { type: array, items: { type: string } }
            diagramKey: { type: string, example: bond-rate-price }
            keyPoints: { type: array, items: { type: string } }
            misconception: { type: string }
            checklist: { type: array, items: { type: string } }
            sourceName: { type: string, example: Investor.gov }
            sourceUrl: { type: string, format: uri }

    QuizResponse:
      type: object
      properties:
        slug: { type: string, example: bond-duration }
        title: { type: string, example: 듀레이션 }
