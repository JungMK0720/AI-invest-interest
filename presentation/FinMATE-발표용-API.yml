openapi: 3.0.3

info:
  title: FinMATE 학습형 금융상품 탐색 API
  version: 2.0.0
  description: |
    투자 성향 진단 결과를 출발점으로 금융상품 구조와 위험 변수를 학습하고,
    교육용 시뮬레이션과 가상 포트폴리오 실험을 제공하는 API다.

    발표 범위(P0)는 진단·상품 탐색·개념 학습·개념별 퀴즈·메커니즘 시뮬레이션·
    교육용 포트폴리오 분석이다. 실데이터 수집, 과거 자료 탭, 관리자 검수 API는
    배포형 P1 확장으로 계획한다.

    본 API는 투자자문·매수/매도 추천·수익 보장·실제 주문을 제공하지 않는다.
    /practice와 /learning/simulations의 결과는 입력 가정과 seed에 기반한 교육용 계산이다.

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 회원가입·로그인
  - name: questions
    description: 투자 성향 진단 질문
  - name: assessments
    description: 진단 생성·결과·이력·탐색 범위
  - name: products
    description: 금융상품 카테고리·예시 상품
  - name: learning
    description: 개념 트리·퀴즈·메커니즘 시뮬레이션
  - name: practice
    description: 교육용 가상 포트폴리오 실험

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 이미 가입된 이메일 }

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 및 access token 발급
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /questions:
    get:
      tags: [questions]
      summary: 활성 진단 질문 조회
      description: 선택지 배점과 질문 가중치는 외부 응답에 포함하지 않는다.
      responses:
        '200':
          description: 질문과 선택지 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Question' }

  /assessments/availability:
    get:
      tags: [assessments]
      summary: 진단 가능 여부 조회
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: FinMATE 진단 정책 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assessments:
    get:
      tags: [assessments]
      summary: 나의 진단 이력 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 진단 이력 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [assessments]
      summary: 답변 제출 및 성향 분석
      description: 규칙 엔진이 점수·5단계 성향·탐색 범위를 결정한다. AI는 근거 문장만 생성하며 실패 시 TEMPLATE으로 폴백한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAssessmentRequest' }
      responses:
        '201':
          description: 진단 생성 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 진단 가능 시점 전 요청 }

  /assessments/{assessmentId}:
    get:
      tags: [assessments]
      summary: 진단 결과 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 본인의 진단 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assessments/{assessmentId}/recommendations:
    get:
      tags: [assessments]
      summary: 탐색 카테고리 조회
      description: 화면 탐색을 위한 내부 필터 결과이며 실제 투자 권유 순위가 아니다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 카테고리 추천 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /product-categories:
    get:
      tags: [products]
      summary: 상품 카테고리 목록
      responses:
        '200':
          description: 자산군·내부 위험등급 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductCategory' }

  /products:
    get:
      tags: [products]
      summary: 예시 상품 목록
      parameters:
        - in: query
          name: categoryId
          schema: { type: string }
          description: 생략하면 전체 상품
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 상품 구조·위험·확인 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/tree:
    get:
      tags: [learning]
      summary: 3단계 학습 개념 트리
      description: 자산군 → 핵심 개념 → 세부 개념을 한 번에 조회한다.
      responses:
        '200':
          description: 개념 트리
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningTree' }

  /learning/concepts:
    get:
      tags: [learning]
      summary: 학습 개념 목록
      responses:
        '200':
          description: 개념 요약 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearningConcept' }

  /learning/concepts/{slug}:
    get:
      tags: [learning]
      summary: 학습 개념 상세
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 한 문장 정의·그림·오해·체크리스트·출처
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningConceptDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/concepts/{slug}/quiz:
    get:
      tags: [learning]
      summary: 개념별 확인 문제 조회
      description: 정답과 해설은 내려주지 않으며 채점 API에서만 공개한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 개념 전용 문항·선택지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizResponse' }

  /learning/concepts/{slug}/quiz/grade:
    post:
      tags: [learning]
      summary: 확인 문제 서버 채점
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizGradeRequest' }
      responses:
        '200':
          description: 정오답·선택지별 해설·다음 학습 행동
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizGradeResponse' }

  /learning/concepts/{slug}/quiz/attempts:
    post:
      tags: [learning]
      summary: 콘텐츠 버전 기반 퀴즈 시도 제출
      description: 선택지 ID와 콘텐츠 버전을 검증하는 확장 제출 계약이다. 진도 저장 DB 연결 전에도 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAttemptRequest' }
      responses:
        '200':
          description: 시도 결과와 선택지별 해설
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResponse' }

  /learning/concepts/{slug}/simulations:
    get:
      tags: [learning]
      summary: 개념에 연결된 시뮬레이션 목록
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 시나리오 명세
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimulationScenario' }

  /learning/simulations:
    get:
      tags: [learning]
      summary: 메커니즘 시뮬레이션 목록
      responses:
        '200':
          description: 금리·수수료·옵션·선물·레버리지 등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationListResponse' }

  /learning/simulations/{scenarioId}:
    get:
      tags: [learning]
      summary: 시뮬레이션 상세·입력 명세
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: 입력 범위·기본값·계산 가정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationScenario' }
        '404': { $ref: '#/components/responses/NotFound' }

  /learning/simulations/{scenarioId}/run:
    post:
      tags: [learning]
      summary: 메커니즘 시뮬레이션 실행
      description: 같은 입력·seed·모델 버전이면 같은 교육용 결과를 반환한다.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRunRequest' }
      responses:
        '200':
          description: 결과·가정·학습 메시지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /practice/products:
    get:
      tags: [practice]
      summary: 모의 포트폴리오용 가상 상품 목록
      description: 실제 판매 상품이 아닌 자산군·메커니즘 학습용 정의다.
      responses:
        '200':
          description: 주식·채권·펀드·ETF·금·리츠·선물·옵션 등
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PracticeProduct' }

  /practice/scenarios:
    get:
      tags: [practice]
      summary: 포트폴리오 충격 시나리오 목록
      responses:
        '200':
          description: 가격·금리·환율·스프레드·비용 충격
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PracticeScenario' }

  /practice/methodology:
    get:
      tags: [practice]
      summary: 포트폴리오 계산 방법론
      responses:
        '200':
          description: 공식·모델 버전·제외 항목·고지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Methodology' }

  /practice/analyze:
    post:
      tags: [practice]
      summary: 가상 포트폴리오 분석
      description: 저장·주문·추천 없이 입력된 바구니와 충격을 서버에서 계산한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeAnalyzeRequest' }
      responses:
        '200':
          description: 손익·낙폭·비용·유동성·자산별 기여도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /practice/compare:
    post:
      tags: [practice]
      summary: 변경 전후 포트폴리오 비교
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeCompareRequest' }
      responses:
        '200':
          description: 같은 충격에서 배분 변경이 만든 차이
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: accessToken

  parameters:
    AssessmentId:
      in: path
      name: assessmentId
      required: true
      schema: { type: string }
    ConceptSlug:
      in: path
      name: slug
      required: true
      schema: { type: string }
    ScenarioId:
      in: path
      name: scenarioId
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: 입력 형식·범위·문항 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 토큰 누락 또는 만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 본인 소유가 아닌 결과 접근
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: INVALID_REQUEST }
        message: { type: string, example: 요청 값을 확인해 주세요. }

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: learner@example.com }
        password: { type: string, format: password, minLength: 8, example: password123! }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: learner@example.com }
        password: { type: string, format: password, example: password123! }

    UserResponse:
      type: object
      required: [id, email]
      properties:
        id: { type: string, example: user-001 }
        email: { type: string, format: email, example: learner@example.com }

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string, example: demo-token-abc }
        user: { $ref: '#/components/schemas/UserResponse' }

    Choice:
      type: object
      required: [id, label, orderNo]
      properties:
        id: { type: string, example: q1-c2 }
        label: { type: string, example: 원금 손실 가능성을 이해하고 있다. }
        orderNo: { type: integer, example: 2 }

    Question:
      type: object
      required: [id, content, orderNo, choices]
      properties:
        id: { type: string, example: q-risk-01 }
        content: { type: string, example: '투자 원금의 일부 손실을 감수할 수 있나요?' }
        orderNo: { type: integer, example: 1 }
        choices:
          type: array
          items: { $ref: '#/components/schemas/Choice' }

    SubmitAnswer:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId: { type: string, example: q-risk-01 }
        choiceId: { type: string, example: q-risk-01-c3 }

    SubmitAssessmentRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SubmitAnswer' }

    Availability:
      type: object
      required: [available, policy, nextAvailableAt]
      properties:
        available: { type: boolean, example: true }
        policy: { type: string, example: MONTHLY_ONCE }
        nextAvailableAt: { type: string, format: date-time, nullable: true }

    Profile:
      type: object
      required: [profileType, profileLabel, profileGrade, totalScore, reasoning, reasoningSource]
      properties:
        profileType: { type: string, example: RISK_NEUTRAL }
        profileLabel: { type: string, example: 위험중립형 }
        profileGrade: { type: integer, minimum: 1, maximum: 5, example: 3 }
        totalScore: { type: integer, minimum: 0, maximum: 100, example: 51 }
        reasoning: { type: string, example: 위험과 손실 가능성을 이해하고 분산을 고려하는 응답이 많았습니다. }
        reasoningSource: { type: string, enum: [LLM, TEMPLATE], example: TEMPLATE }

    AssessmentResult:
      type: object
      required: [id, status, profile, createdAt]
      properties:
        id: { type: string, example: assessment-001 }
        status: { type: string, enum: [COMPLETED], example: COMPLETED }
        profile: { $ref: '#/components/schemas/Profile' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    AssessmentHistory:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssessmentResult' }
        page: { type: integer, example: 0 }
        hasNext: { type: boolean, example: false }

    CategoryRecommendation:
      type: object
      required: [categoryId, categoryName, riskGrade, riskGradeLabel, rank, reason]
      properties:
        categoryId: { type: string, example: CAT3 }
        categoryName: { type: string, example: 채권혼합형 펀드 }
        riskGrade: { type: integer, minimum: 1, maximum: 6, example: 3 }
        riskGradeLabel: { type: string, example: 다소 높은 위험 }
        rank: { type: integer, example: 1 }
        reason: { type: string, example: 현재 성향의 학습 탐색 범위에 포함됩니다. }

    ProductCategory:
      type: object
      required: [id, name, riskGrade, riskGradeLabel, description]
      properties:
        id: { type: string, example: CAT3 }
        name: { type: string, example: 채권혼합형 펀드 }
        riskGrade: { type: integer, minimum: 1, maximum: 6, example: 3 }
        riskGradeLabel: { type: string, example: 다소 높은 위험 }
        description: { type: string }

    Product:
      type: object
      required: [id, categoryId, categoryName, name, riskGrade, expectedPeriod, description, disclaimer]
      properties:
        id: { type: string, example: P301 }
        categoryId: { type: string, example: CAT3 }
        categoryName: { type: string, example: 채권혼합형 펀드 }
        name: { type: string, example: 국내 채권혼합형 펀드 (예시) }
        riskGrade: { type: integer, minimum: 1, maximum: 6, example: 3 }
        riskGradeLabel: { type: string, example: 다소 높은 위험 }
        expectedPeriod: { type: string, example: 1~3년 }
        description: { type: string }
