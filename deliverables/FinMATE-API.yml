openapi: 3.0.3

info:
  title: FinMATE 투자 성향 진단 및 금융상품 탐색 서비스 API
  description: |
    사용자의 투자 목적과 위험 감수 성향을 진단해 투자자 성향을 판정하고,
    과제용 내부 탐색 기준에 따라 안내 카테고리와 예시 상품을 제공하는 API.

    1차 Agile(P0) 범위이며 상품 비교, 가상 포트폴리오, 관리자 CRUD는 2차 범위다.

    등급 체계
      - 투자자 성향 등급: 1(공격투자형) ~ 5(안정형)
      - 카테고리 위험등급: 내부 예시 데이터 기준 1(매우 높은 위험) ~ 6(매우 낮은 위험)
      - 내부 탐색 필터: 상품 카테고리 위험등급 >= 투자자 성향 등급인 카테고리를 안내한다
      - 위 비교식은 실제 투자 권유·적합성·적정성 판단을 대체하지 않는다

    인증
      - 과제 산출물 기준에 따라 Security Schemes 는 정의하지 않는다.
      - 인증이 필요한 오퍼레이션은 `Authorization: Bearer {accessToken}` 헤더를 요구하며,
        누락되거나 유효하지 않으면 401 을 반환한다.
      - 사용자 식별자는 인증 컨텍스트에서 얻으므로 요청 본문으로 받지 않는다.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 회원가입 및 로그인
  - name: questions
    description: 진단 문항 조회
  - name: assessments
    description: 진단 생성, 결과 조회, 탐색 카테고리 조회
  - name: products
    description: 상품 카테고리 및 상품 조회

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: 성공 시 이후 요청에 사용할 accessToken 을 발급한다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /questions:
    get:
      tags: [questions]
      summary: 활성 진단 문항 목록 조회
      description: 선택지의 배점(score)은 응답에 포함하지 않는다.
      operationId: listQuestions
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'

  /assessments:
    post:
      tags: [assessments]
      summary: 진단 답변 제출 및 성향 분석
      description: |
        활성 문항 전체에 대한 답변을 제출하면 진단이 생성되고 분석까지 완료된 결과가 반환된다.
        인증 필요 (`Authorization: Bearer {accessToken}`).

        LLM 근거 생성에 실패해도 진단은 완료된다. 성향 등급과 탐색 카테고리는 규칙 엔진이
        결정하므로 영향을 받지 않으며, 근거 문장만 템플릿으로 대체되고
        `profile.reasoningSource` 가 `TEMPLATE` 로 내려간다.
      operationId: submitAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentRequest'
      responses:
        '201':
          description: 진단 생성 및 분석 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: 미응답 문항, 중복 응답, 문항-선택지 불일치 등 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 진단 문항 또는 상품 카테고리가 준비되지 않아 분석할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assessments/{assessmentId}:
    get:
      tags: [assessments]
      summary: 진단 결과 조회
      description: 본인의 진단만 조회할 수 있다. 인증 필요.
      operationId: getAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/{assessmentId}/recommendations:
    get:
      tags: [assessments]
      summary: 추천 카테고리 목록 조회
      description: 내부 탐색 필터를 통과한 카테고리를 순위 오름차순으로 반환한다. 실제 투자 권유 순위가 아니며 인증이 필요하다.
      operationId: getRecommendations
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRecommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /product-categories:
    get:
      tags: [products]
      summary: 상품 카테고리 목록 조회
      description: 내부 위험등급 오름차순(고위험 우선)으로 반환한다.
      operationId: listCategories
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'

  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 지정하면 해당 카테고리의 상품만 반환한다.
          schema:
            type: string
          example: CAT3
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 조회
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          example: P301
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6d0e1a1e-2b1a-4a7e-9a1f-0f2b3c4d5e6f

  responses:
    BadRequest:
      description: 요청 형식이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 로그인이 필요하거나 토큰이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 본인의 리소스가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, ANALYSIS_UNAVAILABLE, INTERNAL_ERROR
          example: INVALID_REQUEST
        message:
          type: string
          example: 모든 진단 문항에 답변해야 합니다.

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: password123
        name:
          type: string
          example: 홍길동

    UserResponse:
      type: object
      description: 비밀번호 관련 필드는 어떤 응답에도 포함하지 않는다.
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 `Bearer {accessToken}` 형태로 담는다.
        user:
          $ref: '#/components/schemas/UserResponse'

    Question:
      type: object
      required: [id, content, orderNo, choices]
      properties:
        id:
          type: string
          example: Q1
        content:
          type: string
          example: 투자 목적은 무엇입니까?
        orderNo:
          type: integer
          example: 1
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'

    Choice:
      type: object
      required: [id, label, orderNo]
      properties:
        id:
          type: string
          example: Q1C3
        label:
          type: string
          example: 어느 정도 위험을 감수하고 시장 평균 수익을 원한다
        orderNo:
          type: integer
          example: 3

    SubmitAssessmentRequest:
      type: object
      description: 사용자 식별자는 인증 컨텍스트에서 얻으므로 본문에 포함하지 않는다.
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          description: 활성 문항 전체에 대한 답변이어야 한다.
          items:
            $ref: '#/components/schemas/AnswerItem'

    AnswerItem:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          example: Q1
        choiceId:
          type: string
          example: Q1C3

    AssessmentResult:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
          example: COMPLETED
        profile:
          allOf:
            - $ref: '#/components/schemas/InvestmentProfile'
          nullable: true
          description: 분석이 완료되기 전에는 null 이다.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    InvestmentProfile:
      type: object
      required: [profileType, profileLabel, profileGrade, totalScore, reasoning, reasoningSource]
      properties:
        profileType:
          type: string
          enum: [AGGRESSIVE, ACTIVE, NEUTRAL, CONSERVATIVE, STABLE]
          example: NEUTRAL
        profileLabel:
          type: string
          description: 화면 표시용 한글 명칭
          example: 위험중립형
        profileGrade:
          type: integer
          minimum: 1
          maximum: 5
          description: 과제용 내부 탐색 기준으로 사용하는 투자자 성향 등급. 1이 가장 공격적이다.
          example: 3
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 문항 배점 비중을 반영한 가중 평균 점수
          example: 51
        reasoning:
          type: string
          example: 주요 답변을 기준으로 성향 점수 51점이 산출되어 위험중립형으로 분류되었습니다.
        reasoningSource:
          type: string
          enum: [LLM, TEMPLATE]
          description: AI 생성문(LLM)인지 폴백 템플릿(TEMPLATE)인지 구분한다.
          example: LLM

    CategoryRecommendation:
      type: object
      required: [categoryId, categoryName, riskGrade, riskGradeLabel, rank, reason]
      properties:
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        rank:
          type: integer
          minimum: 1
          description: 노출 순위. 성향 등급에 가장 근접한 위험등급이 1순위다.
          example: 1
        reason:
          type: string
          example: 위험중립형의 내부 탐색 기준에 해당하는 위험등급 범위입니다.

    ProductCategory:
      type: object
      required: [id, name, riskGrade, riskGradeLabel, description]
      properties:
        id:
          type: string
          example: CAT3
        name:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        description:
          type: string

    Product:
      type: object
      required: [id, categoryId, categoryName, name, riskGrade, riskGradeLabel, expectedPeriod, description, disclaimer]
      properties:
        id:
          type: string
          example: P301
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        name:
          type: string
          example: 국내 채권혼합형 펀드 (예시)
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        expectedPeriod:
          type: string
          example: 1~3년
        description:
          type: string
        disclaimer:
          type: string
          description: 투자 자문·투자 권유가 아님을 알리는 고지 문구. 상품 상세 화면에 항상 노출한다.
