openapi: 3.0.3

info:
  title: FinMATE 투자 성향 진단 및 금융상품 탐색 서비스 API
  description: |
    사용자의 투자 목적과 위험 감수 성향을 진단해 투자자 성향을 판정하고,
    과제용 내부 탐색 기준에 따라 안내 카테고리와 예시 상품을 제공하는 API.

    1차 Agile(P0) 진단·탐색 흐름에 2차 고도화(학습 개념·확인 문제·모의투자, 주식 용어 사전,
    보조 텍스트 모델, 개인화 학습 경로, 관리자 용어 운영, 세션 관리)를 더한 최종 범위다.
    상품 비교·가상 포트폴리오 저장·실데이터 수집은 다음 범위다.

    등급 체계
      - 투자자 성향 등급: 1(공격투자형) ~ 5(안정형)
      - 카테고리 위험등급: 내부 예시 데이터 기준 1(매우 높은 위험) ~ 6(매우 낮은 위험)
      - 내부 탐색 필터: 상품 카테고리 위험등급 >= 투자자 성향 등급인 카테고리를 안내한다
      - 위 비교식은 실제 투자 권유·적합성·적정성 판단을 대체하지 않는다

    인증
      - 과제 산출물 기준에 따라 Security Schemes 는 정의하지 않는다.
      - 인증이 필요한 오퍼레이션은 `Authorization: Bearer {accessToken}` 헤더를 요구하며,
        누락되거나 유효하지 않으면 401 을 반환한다.
      - 사용자 식별자는 인증 컨텍스트에서 얻으므로 요청 본문으로 받지 않는다.
  version: 2.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 회원가입 및 로그인
  - name: questions
    description: 진단 문항 조회
  - name: assessments
    description: 진단 생성, 결과 조회, 탐색 카테고리 조회
  - name: products
    description: 상품 카테고리 및 상품 조회
  - name: learning
    description: 개념 트리, 확인 문제 채점, 모의투자 시뮬레이션 (로그인 없이 접근 가능)
  - name: glossary
    description: 주식 용어 사전·용어 확인 문제·저장한 용어
  - name: ml
    description: 자유 서술 성향 신호, 질문형 용어 검색, 모델 카드 (로그인 없이 접근 가능)
  - name: me
    description: 개인화 학습 경로, 확인 문제 이력, 오답노트, 복습 일정 (인증 필요)
  - name: admin
    description: 용어 등록·초안·게시·공개 내리기·이력, 운영 현황 (ADMIN 역할 필요)

paths:
  /learning/tree:
    get:
      tags: [learning]
      summary: 학습 개념 트리 전체
      description: >
        3단계 계층(대분류 → 핵심 개념 → 세부 개념)을 한 번에 내려준다.
        클라이언트는 이 응답만으로 좌측 목록을 그리고 펼침·접힘을 로컬에서 처리한다.
      responses:
        '200':
          description: 개념 트리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningTree'
  /learning/concepts:
    get:
      tags: [learning]
      summary: 학습 개념 평면 목록 (v1 호환)
      description: 트리 도입 이전 클라이언트를 위해 유지한다. 신규 화면은 /learning/tree를 쓴다.
      responses:
        '200': { description: 출처 연결 개념 목록 }
  /learning/concepts/{slug}:
    get:
      tags: [learning]
      summary: 학습 개념 상세
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 개념 본문·구조 도식·확인 포인트·체크리스트·breadcrumb·하위 개념
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningConceptDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/quiz:
    get:
      tags: [learning]
      summary: 확인 문제 조회
      description: >
        정답 인덱스와 해설은 응답에 포함하지 않는다. 화면 소스에서 정답이 노출되면
        확인 문제가 학습 도구로 동작하지 않기 때문이며, 채점은 grade 엔드포인트에서만 한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 정답이 제거된 문항 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/quiz/grade:
    post:
      tags: [learning]
      summary: 확인 문제 채점
      description: >
        서버에서만 채점한다. 미응답(selectedIndex = -1)이나 범위를 벗어난 인덱스는
        오답으로 처리하고 400을 내지 않는다. 응답에는 모든 선택지의 해설을 포함해
        왜 틀렸는지까지 학습할 수 있게 한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizGradeRequest'
      responses:
        '200':
          description: 문항별 정오답·해설·결론
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizGradeResponse'

  /practice/products:
    get:
      tags: [learning]
      summary: 모의 투자 연습 상품 목록
      description: 실제 판매 상품이 아니라 메커니즘 학습용 가상 상품 정의다.
      responses:
        '200': { description: 자산군·메커니즘·기본 가정 목록 }
  /practice/scenarios:
    get:
      tags: [learning]
      summary: 모의 투자 충격 시나리오 목록
      responses:
        '200': { description: 가격·금리·환율 등의 교육용 가정 목록 }
  /practice/methodology:
    get:
      tags: [learning]
      summary: 모의 투자 계산 가정과 공식
      responses:
        '200': { description: 모델 버전·가정·출처 }
  /practice/analyze:
    post:
      tags: [learning]
      summary: 사용자가 조합한 포트폴리오 분석
      description: 입력 상품과 충격을 순수 계산하며 저장하지 않는다. 주문·추천·미래 예측이 아니다.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PracticeAnalyzeRequest' } }
      responses:
        '200': { description: 자산별 손익·노출·효과·학습 해설 }
        '400': { description: 입력 범위 또는 예산 오류 }
  /practice/compare:
    post:
      tags: [learning]
      summary: 변경 전후 포트폴리오 비교
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PracticeCompareRequest' } }
      responses:
        '200': { description: 같은 충격에서 배분 변경의 차이 }
        '400': { description: 입력 범위 또는 예산 오류 }
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/simulations:
    get:
      tags: [learning]
      summary: 이 개념으로 실행할 수 있는 모의투자 시나리오
      description: 직접 연결된 시나리오가 없으면 상위 개념의 시나리오를 물려받는다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 시나리오 명세 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulationScenario'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/simulations:
    get:
      tags: [learning]
      summary: 모의투자 시나리오 전체 목록
      responses:
        '200':
          description: 시나리오 명세와 고지 문구
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimulationScenario'
                  notice:
                    type: string
  /learning/simulations/{scenarioId}:
    get:
      tags: [learning]
      summary: 모의투자 시나리오 명세
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: 입력 필드 명세를 포함한 시나리오 정의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationScenario'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/simulations/{scenarioId}/run:
    post:
      tags: [learning]
      summary: 모의투자 실행
      description: >
        계산은 전부 서버에서 한다. 입력값은 시나리오 명세의 min/max로 보정하며 잘못된 값으로
        400을 내지 않고 실제 적용값을 echo로 돌려준다. seed가 같으면 결과가 항상 같다
        (docs/09의 결과 재현성 원칙과 동일). seed를 바꾸면 같은 가정의 다른 시장 경로를 본다.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: { type: string }
                  example:
                    maturityYears: '10'
                    yieldChangeBp: '100'
                    plan: SELL
                seed:
                  type: integer
                  format: int64
                  nullable: true
                  description: 생략하면 서버 기본 seed를 쓴다.
      responses:
        '200':
          description: 지표·차트 계열·표·교훈·가정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '404': { $ref: '#/components/responses/NotFound' }
  /assessments/availability:
    get:
      tags: [assessments]
      summary: 이번 달 진단 가능 여부
      responses:
        '200':
          description: FinMATE 자체 월 1회 정책 상태
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: 성공 시 이후 요청에 사용할 accessToken 을 발급한다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /questions:
    get:
      tags: [questions]
      summary: 활성 진단 문항 목록 조회
      description: 선택지의 배점(score)은 응답에 포함하지 않는다.
      operationId: listQuestions
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'

  /assessments:
    get:
      tags: [assessments]
      summary: 완료한 진단 이력
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: 진단 이력 페이지 }
    post:
      tags: [assessments]
      summary: 진단 답변 제출 및 성향 분석
      description: |
        활성 문항 전체에 대한 답변을 제출하면 진단이 생성되고 분석까지 완료된 결과가 반환된다.
        인증 필요 (`Authorization: Bearer {accessToken}`).

        LLM 근거 생성에 실패해도 진단은 완료된다. 성향 등급과 탐색 카테고리는 규칙 엔진이
        결정하므로 영향을 받지 않으며, 근거 문장만 템플릿으로 대체되고
        `profile.reasoningSource` 가 `TEMPLATE` 로 내려간다.
      operationId: submitAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentRequest'
      responses:
        '201':
          description: 진단 생성 및 분석 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: 미응답 문항, 중복 응답, 문항-선택지 불일치 등 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 진단 문항 또는 상품 카테고리가 준비되지 않아 분석할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assessments/{assessmentId}:
    get:
      tags: [assessments]
      summary: 진단 결과 조회
      description: 본인의 진단만 조회할 수 있다. 인증 필요.
      operationId: getAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/{assessmentId}/recommendations:
    get:
      tags: [assessments]
      summary: 추천 카테고리 목록 조회
      description: 내부 탐색 필터를 통과한 카테고리를 순위 오름차순으로 반환한다. 실제 투자 권유 순위가 아니며 인증이 필요하다.
      operationId: getRecommendations
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRecommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /product-categories:
    get:
      tags: [products]
      summary: 상품 카테고리 목록 조회
      description: 내부 위험등급 오름차순(고위험 우선)으로 반환한다.
      operationId: listCategories
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'

  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 지정하면 해당 카테고리의 상품만 반환한다.
          schema:
            type: string
          example: CAT3
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 조회
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          example: P301
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자
      description: 저장된 세션 토큰이 유효한지 확인하고 역할(USER/ADMIN)을 돌려준다.
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃(세션 폐기)
      description: 서버에 저장된 세션(토큰 해시)을 폐기한다. 이후 같은 토큰은 401이 된다.
      responses:
        '204': { description: 폐기 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /learning/concepts/{slug}/explain:
    post:
      tags: [learning]
      summary: 승인된 개념 콘텐츠 기반 AI 설명
      description: >
        개념 원문을 근거로 질문에 답한다. API 키가 없거나 출력 검증(금칙어·길이)에 실패하면
        템플릿 설명으로 대체하고 source를 TEMPLATE로 표시한다.
      parameters: [ { $ref: '#/components/parameters/ConceptSlug' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplainRequest' }
      responses:
        '200':
          description: 설명과 출처
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplainResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/quiz/attempts:
    post:
      tags: [learning]
      summary: 확인 문제 제출(choice ID 기반)
      description: >
        콘텐츠 버전과 고정 choice ID를 검증해 채점한다. 로그인 상태(Bearer)로 제출하면 시도 이력과
        문항별 복습 상태(1·3·7·14·30일 간격)가 저장된다. 토큰을 보냈는데 유효하지 않으면 401이다.
      parameters: [ { $ref: '#/components/parameters/ConceptSlug' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAttemptRequest' }
      responses:
        '200':
          description: 문항별 정답·해설·요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 콘텐츠 버전이 바뀜. 문제를 다시 불러와야 한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /glossary/categories:
    get:
      tags: [glossary]
      summary: 용어 분류와 공개 용어 수
      responses:
        '200':
          description: 14개 분류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlossaryCategories' }
  /glossary/terms:
    get:
      tags: [glossary]
      summary: 공개 용어 목록·글자 검색
      description: 이름·영문·별칭·정의에 검색어가 포함된 공개 용어를 돌려준다. 의미 검색은 /ml/term-search를 쓴다.
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: category, schema: { type: string, example: valuation } }
        - { in: query, name: level, schema: { type: string, enum: [BASIC, INTERMEDIATE, ADVANCED] } }
      responses:
        '200':
          description: 용어 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlossaryTerms' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /glossary/terms/{slug}:
    get:
      tags: [glossary]
      summary: 용어 상세
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '200':
          description: 정의·설명·공식·예시·주의·관련 용어·연결 개념·출처
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlossaryTerm' }
        '404': { $ref: '#/components/responses/NotFound' }
  /glossary/quiz:
    get:
      tags: [glossary]
      summary: 용어 확인 문제 출제
      description: 정의를 보고 용어를 고르는 4지선다. 정답은 응답에 없고 같은 seed는 같은 문제를 만든다.
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: count, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - { in: query, name: seed, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 문항 목록과 콘텐츠 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlossaryQuiz' }
  /glossary/quiz/grade:
    post:
      tags: [glossary]
      summary: 용어 확인 문제 채점
      description: 로그인 상태로 제출하면 오답이 용어별 복습 목록에 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlossaryQuizGradeRequest' }
      responses:
        '200':
          description: 문항별 정답과 해설
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlossaryQuizGradeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 용어 콘텐츠가 바뀌어 문제를 다시 불러와야 함 }
  /glossary/bookmarks:
    get:
      tags: [glossary]
      summary: 저장한 용어
      responses:
        '200':
          description: 저장한 공개 용어
          content:
            application/json:
              schema:
                type: object
                properties:
                  terms: { type: array, items: { $ref: '#/components/schemas/GlossaryTermSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glossary/bookmarks/{slug}:
    put:
      tags: [glossary]
      summary: 용어 저장
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '204': { description: 저장됨(이미 저장된 경우도 204) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [glossary]
      summary: 용어 저장 해제
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '204': { description: 해제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ml/models:
    get:
      tags: [ml]
      summary: 모델 카드와 실행 정보
      description: ml/train.py가 만든 model-card.json(학습 데이터·지표·기준선·한계)과 로드된 모델 버전·인덱스 크기.
      responses:
        '200':
          description: 모델 카드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsResponse' }
  /ml/style-check:
    post:
      tags: [ml]
      summary: 자유 서술 성향 신호 확인
      description: >
        문장에서 성향·관심사 태그를 추정하고 설문 등급과 2단계 이상 다르면 mismatch를 표시한다.
        근거가 부족하거나 주제와 무관한 문장은 INSUFFICIENT로 보류한다. 등급은 바뀌지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleCheckRequest' }
      responses:
        '200':
          description: 추정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ml/term-search:
    post:
      tags: [ml]
      summary: 질문형 용어 검색
      description: 학습된 IDF·필드 가중치로 DB의 공개 용어를 검색한다. 관리자가 게시하면 즉시 반영된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermSearchRequest' }
      responses:
        '200':
          description: 관련 용어 순위
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/learning-path:
    get:
      tags: [me]
      summary: 개인화 학습 경로
      description: >
        복습 시점이 된 오답, 서술-설문 차이, 자유 서술 관심사 태그, 진단 확인 플래그, 현재 성향 순으로
        다음 학습 개념·용어를 사유와 함께 돌려준다. 모두 맞힌 개념은 제외한다. 상품 추천이 아니다.
      responses:
        '200':
          description: 학습 경로
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPath' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/quiz-attempts:
    get:
      tags: [me]
      summary: 확인 문제 시도 이력
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: 최근 시도 20건씩 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/quiz-attempts/{attemptId}:
    get:
      tags: [me]
      summary: 시도 상세(문항별 선택·정답·해설)
      parameters:
        - { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 시도 상세 }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/wrong-answers:
    get:
      tags: [me]
      summary: 오답노트
      description: 가장 최근 응답이 오답인 문항. target으로 개념 문제와 용어 문제를 구분한다.
      responses:
        '200': { description: 오답 목록 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/review-schedule:
    get:
      tags: [me]
      summary: 복습 일정
      responses:
        '200': { description: 개념·용어별 다음 복습일과 오답 수 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/overview:
    get:
      tags: [admin]
      summary: 운영 현황(관리자)
      responses:
        '200':
          description: 개수와 콘텐츠·모델 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/glossary/terms:
    get:
      tags: [admin]
      summary: 전체 용어(공개·비공개·초안 포함)
      responses:
        '200': { description: 용어 목록 }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: 새 용어 등록(비공개로 생성)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTermCreate' }
      responses:
        '201':
          description: 비공개(DRAFT) 용어
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTerm' }
        '400': { description: slug 형식·분류·학습 개념·관련 용어·출처 URL 검증 실패 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 이미 있는 slug }
  /admin/glossary/terms/{slug}:
    get:
      tags: [admin]
      summary: 편집용 용어(초안이 있으면 초안 내용)
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '200':
          description: 편집용 용어
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTerm' }
    put:
      tags: [admin]
      summary: 초안 저장(공개본은 게시 전까지 유지)
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTermEdit' }
      responses:
        '200': { description: 초안이 반영된 편집용 용어 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/glossary/terms/{slug}/publish:
    post:
      tags: [admin]
      summary: 검증 후 게시
      description: 초안이 있으면 반영해 공개하고, 초안 없는 비공개 용어는 그대로 공개한다. 게시 이력을 남기고 검색 인덱스를 다시 만든다.
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '200': { description: 공개된 용어 }
        '409': { description: 게시할 초안이 없거나 공개본이 그사이 바뀜 }
  /admin/glossary/terms/{slug}/unpublish:
    post:
      tags: [admin]
      summary: 공개 내리기
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '200': { description: 비공개(DRAFT)가 된 용어 }
        '409': { description: 이미 비공개 }
  /admin/glossary/terms/{slug}/draft:
    delete:
      tags: [admin]
      summary: 초안 버리기
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '204': { description: 삭제됨 }
  /admin/glossary/terms/{slug}/revisions:
    get:
      tags: [admin]
      summary: 게시 이력(생성·게시·공개 내림)
      parameters: [ { $ref: '#/components/parameters/GlossarySlug' } ]
      responses:
        '200':
          description: 최신순 이력
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRevisions' }

components:

  parameters:
    ConceptSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      example: duration
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
      example: bond-rate-shock
    GlossarySlug:
      name: slug
      in: path
      required: true
      schema: { type: string, example: per }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6d0e1a1e-2b1a-4a7e-9a1f-0f2b3c4d5e6f

  responses:
    BadRequest:
      description: 요청 형식이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 로그인이 필요하거나 토큰이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 본인의 리소스가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    PracticeAnalyzeRequest:
      type: object
      required: [portfolio, shocks]
      properties:
        portfolio:
          $ref: '#/components/schemas/PracticePortfolio'
        shocks:
          $ref: '#/components/schemas/PracticeShocks'

    PracticeCompareRequest:
      type: object
      required: [before, after, shocks]
      properties:
        before: { $ref: '#/components/schemas/PracticePortfolio' }
        after: { $ref: '#/components/schemas/PracticePortfolio' }
        shocks: { $ref: '#/components/schemas/PracticeShocks' }

    PracticePortfolio:
      type: object
      required: [budget, holdings]
      properties:
        budget: { type: number, minimum: 1000, maximum: 10000000000 }
        holdings:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PracticeHolding' }

    PracticeHolding:
      type: object
      required: [rowId, productId, label, amount, annualFeePercent, duration, leverage, strike, premium, borrowingRatePercent]
      properties:
        rowId: { type: string }
        productId: { type: string, description: /practice/products의 메커니즘 ID }
        label: { type: string }
        amount: { type: number, minimum: 1000 }
        annualFeePercent: { type: number, minimum: 0, maximum: 5 }
        duration: { type: number, minimum: 0.1, maximum: 20 }
        leverage: { type: number, minimum: 1, maximum: 20 }
        strike: { type: number, minimum: 10, maximum: 200 }
        premium: { type: number, minimum: 0.1, maximum: 100 }
        borrowingRatePercent: { type: number, minimum: 0, maximum: 20 }

    PracticeShocks:
      type: object
      required: [equityPercent, ratePoints, creditSpreadPoints, goldPercent, realEstatePercent, fxPercent, days]
      properties:
        equityPercent: { type: number, minimum: -80, maximum: 100 }
        ratePoints: { type: number, minimum: -2, maximum: 2 }
        creditSpreadPoints: { type: number, minimum: -2, maximum: 3 }
        goldPercent: { type: number, minimum: -80, maximum: 100 }
        realEstatePercent: { type: number, minimum: -80, maximum: 100 }
        fxPercent: { type: number, minimum: -50, maximum: 100 }
        days: { type: integer, minimum: 1, maximum: 365 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, ANALYSIS_UNAVAILABLE, INTERNAL_ERROR
          example: INVALID_REQUEST
        message:
          type: string
          example: 모든 진단 문항에 답변해야 합니다.

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: password123
        name:
          type: string
          example: 홍길동

    UserResponse:
      type: object
      description: 비밀번호 관련 필드는 어떤 응답에도 포함하지 않는다.
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: 공개 가입은 항상 USER. ADMIN은 서버 환경변수로만 만든다.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 `Bearer {accessToken}` 형태로 담는다. 서버는 SHA-256 해시만 저장한다.
        expiresAt:
          type: string
          format: date-time
          description: 세션 만료 시각(기본 30일)
        user:
          $ref: '#/components/schemas/UserResponse'

    Question:
      type: object
      required: [id, content, orderNo, choices]
      properties:
        id:
          type: string
          example: Q1
        content:
          type: string
          example: 투자 목적은 무엇입니까?
        orderNo:
          type: integer
          example: 1
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'

    Choice:
      type: object
      required: [id, label, orderNo]
      properties:
        id:
          type: string
          example: Q1C3
        label:
          type: string
          example: 어느 정도 위험을 감수하고 시장 평균 수익을 원한다
        orderNo:
          type: integer
          example: 3

    SubmitAssessmentRequest:
      type: object
      description: 사용자 식별자는 인증 컨텍스트에서 얻으므로 본문에 포함하지 않는다.
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          description: 활성 문항 전체에 대한 답변이어야 한다.
          items:
            $ref: '#/components/schemas/AnswerItem'
        narrative:
          type: string
          nullable: true
          maxLength: 1000
          description: 선택 입력. 투자 생각을 자유롭게 쓴 문장. 등급 확정 뒤 모델이 신호만 추정하며 원문은 저장하지 않는다.

    AnswerItem:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          example: Q1
        choiceId:
          type: string
          example: Q1C3

    AssessmentResult:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
          example: COMPLETED
        profile:
          allOf:
            - $ref: '#/components/schemas/InvestmentProfile'
          nullable: true
          description: 분석이 완료되기 전에는 null 이다.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        evidence:
          allOf:
            - $ref: '#/components/schemas/Evidence'
          nullable: true

    InvestmentProfile:
      type: object
      required: [profileType, profileLabel, profileGrade, totalScore, reasoning, reasoningSource]
      properties:
        profileType:
          type: string
          enum: [AGGRESSIVE, ACTIVE, NEUTRAL, CONSERVATIVE, STABLE]
          example: NEUTRAL
        profileLabel:
          type: string
          description: 화면 표시용 한글 명칭
          example: 위험중립형
        profileGrade:
          type: integer
          minimum: 1
          maximum: 5
          description: 과제용 내부 탐색 기준으로 사용하는 투자자 성향 등급. 1이 가장 공격적이다.
          example: 3
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 문항 배점 비중을 반영한 가중 평균 점수
          example: 51
        reasoning:
          type: string
          example: 주요 답변을 기준으로 성향 점수 51점이 산출되어 위험중립형으로 분류되었습니다.
        reasoningSource:
          type: string
          enum: [LLM, TEMPLATE]
          description: AI 생성문(LLM)인지 폴백 템플릿(TEMPLATE)인지 구분한다.
          example: LLM

    CategoryRecommendation:
      type: object
      required: [categoryId, categoryName, riskGrade, riskGradeLabel, rank, reason]
      properties:
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        rank:
          type: integer
          minimum: 1
          description: 노출 순위. 성향 등급에 가장 근접한 위험등급이 1순위다.
          example: 1
        reason:
          type: string
          example: 위험중립형의 내부 탐색 기준에 해당하는 위험등급 범위입니다.

    ProductCategory:
      type: object
      required: [id, name, riskGrade, riskGradeLabel, description]
      properties:
        id:
          type: string
          example: CAT3
        name:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        description:
          type: string

    Product:
      type: object
      required: [id, categoryId, categoryName, name, riskGrade, riskGradeLabel, expectedPeriod, description, disclaimer]
      properties:
        id:
          type: string
          example: P301
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        name:
          type: string
          example: 국내 채권혼합형 펀드 (예시)
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        expectedPeriod:
          type: string
          example: 1~3년
        description:
          type: string
        disclaimer:
          type: string
          description: 투자 자문·투자 권유가 아님을 알리는 고지 문구. 상품 상세 화면에 항상 노출한다.


    # ---------------------------------------------------------------- 학습 도메인

    LearningTreeNode:
      type: object
      description: 좌측 개념 트리의 한 노드. children을 그대로 품어 한 번의 호출로 전체를 그린다.
      properties:
        slug: { type: string, example: duration }
        title: { type: string, example: 듀레이션 }
        summary: { type: string, example: 금리 변화에 가격이 얼마나 민감한지를 나타내는 숫자 }
        level:
          type: integer
          enum: [1, 2, 3]
          description: 1=대분류, 2=핵심 개념, 3=세부 개념
        hasSimulation:
          type: boolean
          description: 이 개념에 직접 연결된 모의투자 시나리오가 있는지
        quizCount: { type: integer, example: 1 }
        descendantCount: { type: integer, example: 0 }
        children:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'

    LearningTree:
      type: object
      properties:
        contentVersion:
          type: string
          example: learning-content-v2-2026-09-09
          description: 콘텐츠 개정 버전. 확인 문제 채점 결과와 함께 기록해 재현성을 남긴다.
        conceptCount: { type: integer, example: 59 }
        roots:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'
        notice:
          type: string
          description: 교육용 콘텐츠이며 가입·매매를 권유하지 않음을 알리는 고지

    LearningConceptDetail:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        oneLiner:
          type: string
          description: 한 문장 정의. docs/10의 학습 5단계 중 1단계.
        level: { type: integer }
        explanation:
          type: array
          items: { type: string }
          description: 문단 배열
        keyPoints:
          type: array
          items: { type: string }
        checklist:
          type: array
          items: { type: string }
          description: 실제 상품을 볼 때 확인할 문서·항목
        misconception:
          type: string
          nullable: true
        diagramKey:
          type: string
          example: DURATION
          description: 구조 그림 종류. 클라이언트가 도식으로 해석한다.
        sourceName: { type: string, example: Investor.gov 채권 안내 }
        sourceUrl: { type: string, format: uri }
        simulationId:
          type: string
          nullable: true
          example: bond-rate-shock
        quizCount: { type: integer }
        breadcrumb:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              title: { type: string }
              level: { type: integer }
        children:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'
        relatedSlugs:
          type: array
          items: { type: string }
        contentVersion: { type: string }
        notice: { type: string }

    QuizQuestion:
      type: object
      description: 정답과 해설이 제거된 문항. options는 표시 순서 그대로의 라벨 배열이다.
      properties:
        id: { type: string, example: duration-q1 }
        prompt: { type: string }
        difficulty:
          type: string
          enum: [BASIC, INTERMEDIATE, ADVANCED]
        options:
          type: array
          items: { type: string }

    QuizResponse:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        contentVersion: { type: string }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        notice: { type: string }

    QuizGradeRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              selectedIndex:
                type: integer
                description: QuizQuestion.options의 인덱스. -1은 미응답이며 오답 처리된다.
                example: 1

    QuizGradeResponse:
      type: object
      properties:
        slug: { type: string }
        total: { type: integer }
        correctCount: { type: integer }
        scorePercent: { type: integer }
        contentVersion: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              prompt: { type: string }
              selectedIndex: { type: integer }
              correctIndex: { type: integer }
              correct: { type: boolean }
              options:
                type: array
                description: 모든 선택지의 해설. 오답 이유까지 학습하도록 정답 여부와 무관하게 전부 내려준다.
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    label: { type: string }
                    correct: { type: boolean }
                    rationale: { type: string }
              takeaway:
                type: string
                description: 정오답과 무관하게 남겨야 하는 한 줄 결론
        summary:
          type: string
          description: 점수가 아니라 다음 행동을 안내한다. 높은 점수를 투자 적합성으로 오인하지 않게 한다.

    SimulationInputField:
      type: object
      description: 서버가 내려주는 입력 명세. 클라이언트는 이것으로 폼을 생성하므로 시나리오 추가 시 화면 코드가 바뀌지 않는다.
      properties:
        key: { type: string, example: yieldChangeBp }
        label: { type: string, example: 금리 변동 }
        type:
          type: string
          enum: [NUMBER, CHOICE]
        unit: { type: string, nullable: true, example: bp }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        step: { type: number, nullable: true }
        defaultValue: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
        help: { type: string }

    SimulationScenario:
      type: object
      properties:
        id: { type: string, example: bond-rate-shock }
        title: { type: string, example: 금리가 움직일 때 채권 가격 }
        question:
          type: string
          example: 금리가 1%p 오르면 내 채권은 얼마나 떨어질까?
        summary: { type: string }
        mechanism:
          type: string
          description: 계산식의 요약. 결과를 검증 가능하게 만들기 위해 노출한다.
        conceptSlugs:
          type: array
          items: { type: string }
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/SimulationInputField'
        randomised:
          type: boolean
          description: 난수 경로를 쓰는 시나리오인지. true면 화면에 seed 재추첨 버튼을 노출한다.
        notice: { type: string }

    SimulationRun:
      type: object
      properties:
        scenarioId: { type: string }
        title: { type: string }
        headline:
          type: string
          description: 숫자보다 해석을 먼저 읽게 하는 한 줄 결과
        metrics:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string, description: 포맷된 표시 문자열 }
              rawValue: { type: number, description: 비교·검증용 원값 }
              unit: { type: string, nullable: true }
              tone:
                type: string
                enum: [GOOD, BAD, NEUTRAL]
              note: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind:
                type: string
                enum: [line, bar, waterfall]
              unit: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    value: { type: number }
        tables:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              columns:
                type: array
                items: { type: string }
              rows:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    cells:
                      type: array
                      items: { type: string }
              note: { type: string }
        lessons:
          type: array
          items: { type: string }
          description: 입력값에 따라 문장이 달라지는 교훈
        assumptions:
          type: array
          items: { type: string }
          description: 계산에 사용한 가정. 결과를 예측으로 오인하지 않게 항상 노출한다.
        echo:
          type: object
          additionalProperties: { type: string }
          description: 명세 범위로 보정된 실제 적용 입력값
        seed:
          type: integer
          format: int64
        notice: { type: string }

    # ---------------------------------------------------------------- 2차 고도화 스키마
    Evidence:
      type: object
      description: 진단 당시 기록. 이후 문항이 바뀌어도 이 스냅샷으로 결과를 설명한다.
      properties:
        ruleVersion: { type: string, example: finmate-exploration-v1.1 }
        questionnaireVersion: { type: string, description: 활성 문항·선택지의 SHA-256 }
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              question: { type: string }
              answer: { type: string }
        reviewFlags:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [SHORT_HORIZON, HIGH_CONCENTRATION, CONFLICTING_PREFERENCES, NARRATIVE_MISMATCH] }
              message: { type: string }
        narrative:
          allOf: [ { $ref: '#/components/schemas/NarrativeSignal' } ]
          nullable: true
    NarrativeSignal:
      type: object
      description: 자유 서술의 모델 추정. 원문은 저장하지 않는다.
      properties:
        status: { type: string, enum: [ESTIMATED, INSUFFICIENT] }
        profileType: { type: string, nullable: true, enum: [AGGRESSIVE, ACTIVE, NEUTRAL, CONSERVATIVE, STABLE] }
        profileLabel: { type: string, nullable: true }
        grade: { type: integer, nullable: true, minimum: 1, maximum: 5 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        mismatch: { type: boolean, description: 설문 등급과 2단계 이상 다르고 확신도 0.5 이상 }
        tags: { type: array, items: { $ref: '#/components/schemas/TagSignal' } }
        modelVersion: { type: string, example: 2.0.0 }
    TagSignal:
      type: object
      properties:
        code: { type: string, enum: [PRINCIPAL_FOCUS, SHORT_TERM_NEED, LONG_TERM, HIGH_RETURN, LOSS_EXPERIENCE, BEGINNER, LEVERAGE_INTEREST, INCOME_FOCUS, FOMO_HERDING] }
        label: { type: string, example: 레버리지·파생 관심 }
        score: { type: number }
    ExplainRequest:
      type: object
      properties:
        question: { type: string, maxLength: 300 }
    ExplainResponse:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        answer: { type: string }
        source: { type: string, enum: [CLAUDE, TEMPLATE] }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        contentVersion: { type: string }
        notice: { type: string }
    QuizAttemptRequest:
      type: object
      required: [contentVersion, answers]
      properties:
        contentVersion: { type: string }
        answers:
          type: array
          items:
            type: object
            required: [questionId]
            properties:
              questionId: { type: string }
              choiceId: { type: string, nullable: true, example: risk-return-q1-choice-0 }
    QuizAttemptResponse:
      type: object
      properties:
        slug: { type: string }
        total: { type: integer }
        answered: { type: integer }
        correctCount: { type: integer }
        scorePercent: { type: integer }
        contentVersion: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              prompt: { type: string }
              selectedChoiceId: { type: string, nullable: true }
              correctChoiceId: { type: string }
              correct: { type: boolean }
              takeaway: { type: string }
        summary: { type: string }
        notice: { type: string }
    GlossaryCategories:
      type: object
      properties:
        contentVersion: { type: string, description: 시드 버전 + 공개 용어 집합 해시 }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: valuation }
              order: { type: integer }
              name: { type: string, example: 가치평가 지표 }
              description: { type: string }
              termCount: { type: integer }
    GlossaryTermSummary:
      type: object
      properties:
        slug: { type: string, example: per }
        term: { type: string, example: PER }
        english: { type: string }
        categoryId: { type: string }
        level: { type: string, enum: [BASIC, INTERMEDIATE, ADVANCED] }
        definition: { type: string }
    GlossaryTerms:
      type: object
      properties:
        contentVersion: { type: string }
        total: { type: integer }
        terms: { type: array, items: { $ref: '#/components/schemas/GlossaryTermSummary' } }
    GlossaryTerm:
      allOf:
        - $ref: '#/components/schemas/GlossaryTermSummary'
        - type: object
          properties:
            fullName: { type: string, nullable: true, example: 주가수익비율 }
            aliases: { type: array, items: { type: string } }
            explanation: { type: string }
            formula: { type: string, nullable: true }
            example: { type: string, nullable: true }
            caution: { type: string, nullable: true }
            related: { type: array, items: { type: string }, description: 공개된 관련 용어 slug }
            conceptSlug: { type: string, description: 연결된 학습 개념 }
            sourceName: { type: string }
            sourceUrl: { type: string, format: uri }
            contentVersion: { type: string }
            notice: { type: string }
    GlossaryQuiz:
      type: object
      properties:
        contentVersion: { type: string }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: 불투명 문항 ID(정답 정보 없음) }
              prompt: { type: string }
              choices:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    text: { type: string }
        notice: { type: string }
    GlossaryQuizGradeRequest:
      type: object
      required: [contentVersion, answers]
      properties:
        contentVersion: { type: string }
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              choiceId: { type: string }
    GlossaryQuizGradeResponse:
      type: object
      properties:
        total: { type: integer }
        answered: { type: integer }
        correctCount: { type: integer }
        scorePercent: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              termSlug: { type: string }
              selectedChoiceId: { type: string }
              correctChoiceId: { type: string }
              correct: { type: boolean }
              explanation: { type: string }
        contentVersion: { type: string }
        notice: { type: string }
    ModelsResponse:
      type: object
      properties:
        card:
          type: object
          properties:
            generatedBy: { type: string, example: ml/train.py }
            models:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, enum: [style-signal, term-retrieval] }
                  name: { type: string }
                  version: { type: string }
                  task: { type: string }
                  algorithm: { type: string }
                  trainingData: { type: string }
                  evaluationData: { type: string }
                  metrics: { type: object, additionalProperties: { type: number } }
                  baselines: { type: object, additionalProperties: { type: number } }
                  intendedUse: { type: string }
                  notIntendedUse: { type: string }
                  limitations: { type: array, items: { type: string } }
        runtime: { type: object, additionalProperties: true }
    StyleCheckRequest:
      type: object
      required: [text, questionnaireGrade]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        questionnaireGrade: { type: integer, minimum: 1, maximum: 5 }
    StyleCheckResponse:
      type: object
      properties:
        status: { type: string, enum: [ESTIMATED, INSUFFICIENT] }
        estimatedProfileType: { type: string, nullable: true }
        estimatedProfileLabel: { type: string, nullable: true }
        estimatedGrade: { type: integer, nullable: true }
        confidence: { type: number }
        questionnaireGrade: { type: integer }
        mismatch: { type: boolean }
        probabilities: { type: object, additionalProperties: { type: number } }
        tags: { type: array, items: { $ref: '#/components/schemas/TagSignal' } }
        learningLinks:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              message: { type: string }
              concepts: { type: array, items: { $ref: '#/components/schemas/LinkItem' } }
              terms: { type: array, items: { $ref: '#/components/schemas/LinkItem' } }
        modelVersion: { type: string }
        notice: { type: string }
    LinkItem:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
    TermSearchRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500, example: 빌린 돈을 못 갚으면 증권사가 주식을 파는 것 }
        limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
    TermSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              term: { type: string }
              categoryId: { type: string }
              definition: { type: string }
              score: { type: number, description: 필드 코사인 가중합 + 이름 가산점(0~약 4.2) }
              nameMatched: { type: boolean }
        modelVersion: { type: string }
        indexedTerms: { type: integer }
    LearningPathStep:
      type: object
      properties:
        kind: { type: string, enum: [REVIEW, CONCEPT, TERM] }
        target: { type: string, enum: [CONCEPT, TERM] }
        slug: { type: string }
        title: { type: string }
        reasonCode: { type: string, description: 'DUE_REVIEW, NARRATIVE_MISMATCH, PROFILE, STARTER, 태그·확인 플래그 코드' }
        reason: { type: string }
    LearningPath:
      type: object
      properties:
        basis:
          type: object
          nullable: true
          properties:
            assessmentId: { type: string }
            profileType: { type: string }
            profileLabel: { type: string }
            assessedAt: { type: string, format: date-time }
            reviewFlags: { type: array, items: { type: string } }
            narrativeTags: { type: array, items: { type: object, properties: { code: { type: string }, label: { type: string } } } }
            narrativeMismatch: { type: boolean }
        reviews: { type: array, items: { $ref: '#/components/schemas/LearningPathStep' } }
        concepts: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/LearningPathStep' } }
        terms: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/LearningPathStep' } }
        rulesVersion: { type: string }
        generatedAt: { type: string, format: date-time }
        notice: { type: string }
    AdminOverview:
      type: object
      properties:
        users: { type: integer }
        admins: { type: integer }
        completedAssessments: { type: integer }
        quizAttempts: { type: integer }
        publishedTerms: { type: integer }
        hiddenTerms: { type: integer }
        pendingDrafts: { type: integer }
        glossaryContentVersion: { type: string }
        learningContentVersion: { type: string }
        styleModelVersion: { type: string }
        termModelVersion: { type: string }
        generatedAt: { type: string, format: date-time }
    AdminTermEdit:
      type: object
      required: [categoryId, term, english, aliases, level, definition, explanation, related, conceptSlug, sourceName, sourceUrl]
      properties:
        categoryId: { type: string }
        term: { type: string, maxLength: 160 }
        fullName: { type: string, nullable: true }
        english: { type: string }
        aliases: { type: array, items: { type: string } }
        level: { type: string, enum: [BASIC, INTERMEDIATE, ADVANCED] }
        definition: { type: string, maxLength: 500 }
        explanation: { type: string, maxLength: 4000 }
        formula: { type: string, nullable: true }
        example: { type: string, nullable: true }
        caution: { type: string, nullable: true }
        related: { type: array, items: { type: string }, description: 존재하는 용어 slug만 허용 }
        conceptSlug: { type: string, description: 존재하는 학습 개념만 허용 }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri, description: http/https만 허용 }
    AdminTermCreate:
      type: object
      required: [slug, content]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: earnings-yield }
        content: { $ref: '#/components/schemas/AdminTermEdit' }
    AdminTerm:
      allOf:
        - $ref: '#/components/schemas/AdminTermEdit'
        - type: object
          properties:
            slug: { type: string }
            status: { type: string, enum: [DRAFT, PUBLISHED] }
            contentVersion: { type: string }
            updatedAt: { type: string, format: date-time }
            hasDraft: { type: boolean }
    AdminRevisions:
      type: object
      properties:
        slug: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              action: { type: string, enum: [CREATED, PUBLISHED, UNPUBLISHED] }
              contentVersion: { type: string }
              editorEmail: { type: string }
              createdAt: { type: string, format: date-time }

# 고도화 API 메모
# - GET /assessments/availability: monthly-kst-v1 정책 상태와 다음 진단일
# - GET /assessments?page=0: 완료 이력 페이지
# - AssessmentResult.evidence: 당시 답변·ruleVersion·questionnaireVersion·reviewFlags
# - GET /learning/tree: 3단계 개념 트리 (59개 개념)
# - POST /learning/concepts/{slug}/quiz/grade: 서버 채점. 정답은 클라이언트로 내려가지 않는다.
# - POST /learning/simulations/{scenarioId}/run: 11개 모의투자 시나리오. seed 고정 시 결과 재현.
# - 학습 API는 로그인 없이 접근 가능하다 (docs/09: 재진단 제한과 무관하게 학습은 열려 있어야 한다).
# 2차 고도화(2026-10)
# - 주식 용어 사전 247개: /glossary/*, 관리자 운영 /admin/glossary/terms/*
# - 보조 모델: /ml/style-check, /ml/term-search, /ml/models (Python 학습, Java 추론, 정답 일치 테스트)
# - 진단 자유 서술(narrative)과 NARRATIVE_MISMATCH 확인 플래그, 개인화 학습 경로 /me/learning-path
# - 세션 토큰 DB 저장·만료·폐기: /auth/me, /auth/logout
