openapi: 3.0.3

info:
  title: FinMATE 투자 성향 진단 및 금융상품 탐색 서비스 API
  description: |
    사용자의 투자 목적과 위험 감수 성향을 진단해 투자자 성향을 판정하고,
    과제용 내부 탐색 기준에 따라 안내 카테고리와 예시 상품을 제공하는 API.

    1차 Agile(P0) 범위이며 상품 비교, 가상 포트폴리오, 관리자 CRUD는 2차 범위다.

    등급 체계
      - 투자자 성향 등급: 1(공격투자형) ~ 5(안정형)
      - 카테고리 위험등급: 내부 예시 데이터 기준 1(매우 높은 위험) ~ 6(매우 낮은 위험)
      - 내부 탐색 필터: 상품 카테고리 위험등급 >= 투자자 성향 등급인 카테고리를 안내한다
      - 위 비교식은 실제 투자 권유·적합성·적정성 판단을 대체하지 않는다

    인증
      - 과제 산출물 기준에 따라 Security Schemes 는 정의하지 않는다.
      - 인증이 필요한 오퍼레이션은 `Authorization: Bearer {accessToken}` 헤더를 요구하며,
        누락되거나 유효하지 않으면 401 을 반환한다.
      - 사용자 식별자는 인증 컨텍스트에서 얻으므로 요청 본문으로 받지 않는다.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: auth
    description: 회원가입 및 로그인
  - name: questions
    description: 진단 문항 조회
  - name: assessments
    description: 진단 생성, 결과 조회, 탐색 카테고리 조회
  - name: products
    description: 상품 카테고리 및 상품 조회
  - name: learning
    description: 개념 트리, 확인 문제 채점, 모의투자 시뮬레이션 (로그인 없이 접근 가능)

paths:
  /learning/tree:
    get:
      tags: [learning]
      summary: 학습 개념 트리 전체
      description: >
        3단계 계층(대분류 → 핵심 개념 → 세부 개념)을 한 번에 내려준다.
        클라이언트는 이 응답만으로 좌측 목록을 그리고 펼침·접힘을 로컬에서 처리한다.
      responses:
        '200':
          description: 개념 트리
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningTree'
  /learning/concepts:
    get:
      tags: [learning]
      summary: 학습 개념 평면 목록 (v1 호환)
      description: 트리 도입 이전 클라이언트를 위해 유지한다. 신규 화면은 /learning/tree를 쓴다.
      responses:
        '200': { description: 출처 연결 개념 목록 }
  /learning/concepts/{slug}:
    get:
      tags: [learning]
      summary: 학습 개념 상세
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 개념 본문·구조 도식·확인 포인트·체크리스트·breadcrumb·하위 개념
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningConceptDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/quiz:
    get:
      tags: [learning]
      summary: 확인 문제 조회
      description: >
        정답 인덱스와 해설은 응답에 포함하지 않는다. 화면 소스에서 정답이 노출되면
        확인 문제가 학습 도구로 동작하지 않기 때문이며, 채점은 grade 엔드포인트에서만 한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 정답이 제거된 문항 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/quiz/grade:
    post:
      tags: [learning]
      summary: 확인 문제 채점
      description: >
        서버에서만 채점한다. 미응답(selectedIndex = -1)이나 범위를 벗어난 인덱스는
        오답으로 처리하고 400을 내지 않는다. 응답에는 모든 선택지의 해설을 포함해
        왜 틀렸는지까지 학습할 수 있게 한다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizGradeRequest'
      responses:
        '200':
          description: 문항별 정오답·해설·결론
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizGradeResponse'

  /practice/products:
    get:
      tags: [learning]
      summary: 모의 투자 연습 상품 목록
      description: 실제 판매 상품이 아니라 메커니즘 학습용 가상 상품 정의다.
      responses:
        '200': { description: 자산군·메커니즘·기본 가정 목록 }
  /practice/scenarios:
    get:
      tags: [learning]
      summary: 모의 투자 충격 시나리오 목록
      responses:
        '200': { description: 가격·금리·환율 등의 교육용 가정 목록 }
  /practice/methodology:
    get:
      tags: [learning]
      summary: 모의 투자 계산 가정과 공식
      responses:
        '200': { description: 모델 버전·가정·출처 }
  /practice/analyze:
    post:
      tags: [learning]
      summary: 사용자가 조합한 포트폴리오 분석
      description: 입력 상품과 충격을 순수 계산하며 저장하지 않는다. 주문·추천·미래 예측이 아니다.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PracticeAnalyzeRequest' } }
      responses:
        '200': { description: 자산별 손익·노출·효과·학습 해설 }
        '400': { description: 입력 범위 또는 예산 오류 }
  /practice/compare:
    post:
      tags: [learning]
      summary: 변경 전후 포트폴리오 비교
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PracticeCompareRequest' } }
      responses:
        '200': { description: 같은 충격에서 배분 변경의 차이 }
        '400': { description: 입력 범위 또는 예산 오류 }
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/concepts/{slug}/simulations:
    get:
      tags: [learning]
      summary: 이 개념으로 실행할 수 있는 모의투자 시나리오
      description: 직접 연결된 시나리오가 없으면 상위 개념의 시나리오를 물려받는다.
      parameters:
        - $ref: '#/components/parameters/ConceptSlug'
      responses:
        '200':
          description: 시나리오 명세 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulationScenario'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/simulations:
    get:
      tags: [learning]
      summary: 모의투자 시나리오 전체 목록
      responses:
        '200':
          description: 시나리오 명세와 고지 문구
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimulationScenario'
                  notice:
                    type: string
  /learning/simulations/{scenarioId}:
    get:
      tags: [learning]
      summary: 모의투자 시나리오 명세
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: 입력 필드 명세를 포함한 시나리오 정의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationScenario'
        '404': { $ref: '#/components/responses/NotFound' }
  /learning/simulations/{scenarioId}/run:
    post:
      tags: [learning]
      summary: 모의투자 실행
      description: >
        계산은 전부 서버에서 한다. 입력값은 시나리오 명세의 min/max로 보정하며 잘못된 값으로
        400을 내지 않고 실제 적용값을 echo로 돌려준다. seed가 같으면 결과가 항상 같다
        (docs/09의 결과 재현성 원칙과 동일). seed를 바꾸면 같은 가정의 다른 시장 경로를 본다.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: { type: string }
                  example:
                    maturityYears: '10'
                    yieldChangeBp: '100'
                    plan: SELL
                seed:
                  type: integer
                  format: int64
                  nullable: true
                  description: 생략하면 서버 기본 seed를 쓴다.
      responses:
        '200':
          description: 지표·차트 계열·표·교훈·가정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '404': { $ref: '#/components/responses/NotFound' }
  /assessments/availability:
    get:
      tags: [assessments]
      summary: 이번 달 진단 가능 여부
      responses:
        '200':
          description: FinMATE 자체 월 1회 정책 상태
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: 성공 시 이후 요청에 사용할 accessToken 을 발급한다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /questions:
    get:
      tags: [questions]
      summary: 활성 진단 문항 목록 조회
      description: 선택지의 배점(score)은 응답에 포함하지 않는다.
      operationId: listQuestions
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'

  /assessments:
    get:
      tags: [assessments]
      summary: 완료한 진단 이력
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: 진단 이력 페이지 }
    post:
      tags: [assessments]
      summary: 진단 답변 제출 및 성향 분석
      description: |
        활성 문항 전체에 대한 답변을 제출하면 진단이 생성되고 분석까지 완료된 결과가 반환된다.
        인증 필요 (`Authorization: Bearer {accessToken}`).

        LLM 근거 생성에 실패해도 진단은 완료된다. 성향 등급과 탐색 카테고리는 규칙 엔진이
        결정하므로 영향을 받지 않으며, 근거 문장만 템플릿으로 대체되고
        `profile.reasoningSource` 가 `TEMPLATE` 로 내려간다.
      operationId: submitAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentRequest'
      responses:
        '201':
          description: 진단 생성 및 분석 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: 미응답 문항, 중복 응답, 문항-선택지 불일치 등 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 진단 문항 또는 상품 카테고리가 준비되지 않아 분석할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assessments/{assessmentId}:
    get:
      tags: [assessments]
      summary: 진단 결과 조회
      description: 본인의 진단만 조회할 수 있다. 인증 필요.
      operationId: getAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/{assessmentId}/recommendations:
    get:
      tags: [assessments]
      summary: 추천 카테고리 목록 조회
      description: 내부 탐색 필터를 통과한 카테고리를 순위 오름차순으로 반환한다. 실제 투자 권유 순위가 아니며 인증이 필요하다.
      operationId: getRecommendations
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRecommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /product-categories:
    get:
      tags: [products]
      summary: 상품 카테고리 목록 조회
      description: 내부 위험등급 오름차순(고위험 우선)으로 반환한다.
      operationId: listCategories
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'

  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 지정하면 해당 카테고리의 상품만 반환한다.
          schema:
            type: string
          example: CAT3
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 조회
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          example: P301
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    ConceptSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      example: duration
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
      example: bond-rate-shock
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6d0e1a1e-2b1a-4a7e-9a1f-0f2b3c4d5e6f

  responses:
    BadRequest:
      description: 요청 형식이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 로그인이 필요하거나 토큰이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 본인의 리소스가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    PracticeAnalyzeRequest:
      type: object
      required: [portfolio, shocks]
      properties:
        portfolio:
          $ref: '#/components/schemas/PracticePortfolio'
        shocks:
          $ref: '#/components/schemas/PracticeShocks'

    PracticeCompareRequest:
      type: object
      required: [before, after, shocks]
      properties:
        before: { $ref: '#/components/schemas/PracticePortfolio' }
        after: { $ref: '#/components/schemas/PracticePortfolio' }
        shocks: { $ref: '#/components/schemas/PracticeShocks' }

    PracticePortfolio:
      type: object
      required: [budget, holdings]
      properties:
        budget: { type: number, minimum: 1000, maximum: 10000000000 }
        holdings:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PracticeHolding' }

    PracticeHolding:
      type: object
      required: [rowId, productId, label, amount, annualFeePercent, duration, leverage, strike, premium, borrowingRatePercent]
      properties:
        rowId: { type: string }
        productId: { type: string, description: /practice/products의 메커니즘 ID }
        label: { type: string }
        amount: { type: number, minimum: 1000 }
        annualFeePercent: { type: number, minimum: 0, maximum: 5 }
        duration: { type: number, minimum: 0.1, maximum: 20 }
        leverage: { type: number, minimum: 1, maximum: 20 }
        strike: { type: number, minimum: 10, maximum: 200 }
        premium: { type: number, minimum: 0.1, maximum: 100 }
        borrowingRatePercent: { type: number, minimum: 0, maximum: 20 }

    PracticeShocks:
      type: object
      required: [equityPercent, ratePoints, creditSpreadPoints, goldPercent, realEstatePercent, fxPercent, days]
      properties:
        equityPercent: { type: number, minimum: -80, maximum: 100 }
        ratePoints: { type: number, minimum: -2, maximum: 2 }
        creditSpreadPoints: { type: number, minimum: -2, maximum: 3 }
        goldPercent: { type: number, minimum: -80, maximum: 100 }
        realEstatePercent: { type: number, minimum: -80, maximum: 100 }
        fxPercent: { type: number, minimum: -50, maximum: 100 }
        days: { type: integer, minimum: 1, maximum: 365 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, ANALYSIS_UNAVAILABLE, INTERNAL_ERROR
          example: INVALID_REQUEST
        message:
          type: string
          example: 모든 진단 문항에 답변해야 합니다.

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          example: password123
        name:
          type: string
          example: 홍길동

    UserResponse:
      type: object
      description: 비밀번호 관련 필드는 어떤 응답에도 포함하지 않는다.
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 `Bearer {accessToken}` 형태로 담는다.
        user:
          $ref: '#/components/schemas/UserResponse'

    Question:
      type: object
      required: [id, content, orderNo, choices]
      properties:
        id:
          type: string
          example: Q1
        content:
          type: string
          example: 투자 목적은 무엇입니까?
        orderNo:
          type: integer
          example: 1
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'

    Choice:
      type: object
      required: [id, label, orderNo]
      properties:
        id:
          type: string
          example: Q1C3
        label:
          type: string
          example: 어느 정도 위험을 감수하고 시장 평균 수익을 원한다
        orderNo:
          type: integer
          example: 3

    SubmitAssessmentRequest:
      type: object
      description: 사용자 식별자는 인증 컨텍스트에서 얻으므로 본문에 포함하지 않는다.
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          description: 활성 문항 전체에 대한 답변이어야 한다.
          items:
            $ref: '#/components/schemas/AnswerItem'

    AnswerItem:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          example: Q1
        choiceId:
          type: string
          example: Q1C3

    AssessmentResult:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
          example: COMPLETED
        profile:
          allOf:
            - $ref: '#/components/schemas/InvestmentProfile'
          nullable: true
          description: 분석이 완료되기 전에는 null 이다.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    InvestmentProfile:
      type: object
      required: [profileType, profileLabel, profileGrade, totalScore, reasoning, reasoningSource]
      properties:
        profileType:
          type: string
          enum: [AGGRESSIVE, ACTIVE, NEUTRAL, CONSERVATIVE, STABLE]
          example: NEUTRAL
        profileLabel:
          type: string
          description: 화면 표시용 한글 명칭
          example: 위험중립형
        profileGrade:
          type: integer
          minimum: 1
          maximum: 5
          description: 과제용 내부 탐색 기준으로 사용하는 투자자 성향 등급. 1이 가장 공격적이다.
          example: 3
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 문항 배점 비중을 반영한 가중 평균 점수
          example: 51
        reasoning:
          type: string
          example: 주요 답변을 기준으로 성향 점수 51점이 산출되어 위험중립형으로 분류되었습니다.
        reasoningSource:
          type: string
          enum: [LLM, TEMPLATE]
          description: AI 생성문(LLM)인지 폴백 템플릿(TEMPLATE)인지 구분한다.
          example: LLM

    CategoryRecommendation:
      type: object
      required: [categoryId, categoryName, riskGrade, riskGradeLabel, rank, reason]
      properties:
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        rank:
          type: integer
          minimum: 1
          description: 노출 순위. 성향 등급에 가장 근접한 위험등급이 1순위다.
          example: 1
        reason:
          type: string
          example: 위험중립형의 내부 탐색 기준에 해당하는 위험등급 범위입니다.

    ProductCategory:
      type: object
      required: [id, name, riskGrade, riskGradeLabel, description]
      properties:
        id:
          type: string
          example: CAT3
        name:
          type: string
          example: 혼합형 펀드
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        description:
          type: string

    Product:
      type: object
      required: [id, categoryId, categoryName, name, riskGrade, riskGradeLabel, expectedPeriod, description, disclaimer]
      properties:
        id:
          type: string
          example: P301
        categoryId:
          type: string
          example: CAT3
        categoryName:
          type: string
          example: 혼합형 펀드
        name:
          type: string
          example: 국내 채권혼합형 펀드 (예시)
        riskGrade:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        riskGradeLabel:
          type: string
          example: 다소 높은 위험
        expectedPeriod:
          type: string
          example: 1~3년
        description:
          type: string
        disclaimer:
          type: string
          description: 투자 자문·투자 권유가 아님을 알리는 고지 문구. 상품 상세 화면에 항상 노출한다.


    # ---------------------------------------------------------------- 학습 도메인

    LearningTreeNode:
      type: object
      description: 좌측 개념 트리의 한 노드. children을 그대로 품어 한 번의 호출로 전체를 그린다.
      properties:
        slug: { type: string, example: duration }
        title: { type: string, example: 듀레이션 }
        summary: { type: string, example: 금리 변화에 가격이 얼마나 민감한지를 나타내는 숫자 }
        level:
          type: integer
          enum: [1, 2, 3]
          description: 1=대분류, 2=핵심 개념, 3=세부 개념
        hasSimulation:
          type: boolean
          description: 이 개념에 직접 연결된 모의투자 시나리오가 있는지
        quizCount: { type: integer, example: 1 }
        descendantCount: { type: integer, example: 0 }
        children:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'

    LearningTree:
      type: object
      properties:
        contentVersion:
          type: string
          example: learning-content-v2-2026-09-09
          description: 콘텐츠 개정 버전. 확인 문제 채점 결과와 함께 기록해 재현성을 남긴다.
        conceptCount: { type: integer, example: 59 }
        roots:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'
        notice:
          type: string
          description: 교육용 콘텐츠이며 가입·매매를 권유하지 않음을 알리는 고지

    LearningConceptDetail:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        oneLiner:
          type: string
          description: 한 문장 정의. docs/10의 학습 5단계 중 1단계.
        level: { type: integer }
        explanation:
          type: array
          items: { type: string }
          description: 문단 배열
        keyPoints:
          type: array
          items: { type: string }
        checklist:
          type: array
          items: { type: string }
          description: 실제 상품을 볼 때 확인할 문서·항목
        misconception:
          type: string
          nullable: true
        diagramKey:
          type: string
          example: DURATION
          description: 구조 그림 종류. 클라이언트가 도식으로 해석한다.
        sourceName: { type: string, example: Investor.gov 채권 안내 }
        sourceUrl: { type: string, format: uri }
        simulationId:
          type: string
          nullable: true
          example: bond-rate-shock
        quizCount: { type: integer }
        breadcrumb:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              title: { type: string }
              level: { type: integer }
        children:
          type: array
          items:
            $ref: '#/components/schemas/LearningTreeNode'
        relatedSlugs:
          type: array
          items: { type: string }
        contentVersion: { type: string }
        notice: { type: string }

    QuizQuestion:
      type: object
      description: 정답과 해설이 제거된 문항. options는 표시 순서 그대로의 라벨 배열이다.
      properties:
        id: { type: string, example: duration-q1 }
        prompt: { type: string }
        difficulty:
          type: string
          enum: [BASIC, INTERMEDIATE, ADVANCED]
        options:
          type: array
          items: { type: string }

    QuizResponse:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        contentVersion: { type: string }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        notice: { type: string }

    QuizGradeRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              selectedIndex:
                type: integer
                description: QuizQuestion.options의 인덱스. -1은 미응답이며 오답 처리된다.
                example: 1

    QuizGradeResponse:
      type: object
      properties:
        slug: { type: string }
        total: { type: integer }
        correctCount: { type: integer }
        scorePercent: { type: integer }
        contentVersion: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              prompt: { type: string }
              selectedIndex: { type: integer }
              correctIndex: { type: integer }
              correct: { type: boolean }
              options:
                type: array
                description: 모든 선택지의 해설. 오답 이유까지 학습하도록 정답 여부와 무관하게 전부 내려준다.
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    label: { type: string }
                    correct: { type: boolean }
                    rationale: { type: string }
              takeaway:
                type: string
                description: 정오답과 무관하게 남겨야 하는 한 줄 결론
        summary:
          type: string
          description: 점수가 아니라 다음 행동을 안내한다. 높은 점수를 투자 적합성으로 오인하지 않게 한다.

    SimulationInputField:
      type: object
      description: 서버가 내려주는 입력 명세. 클라이언트는 이것으로 폼을 생성하므로 시나리오 추가 시 화면 코드가 바뀌지 않는다.
      properties:
        key: { type: string, example: yieldChangeBp }
        label: { type: string, example: 금리 변동 }
        type:
          type: string
          enum: [NUMBER, CHOICE]
        unit: { type: string, nullable: true, example: bp }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        step: { type: number, nullable: true }
        defaultValue: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
        help: { type: string }

    SimulationScenario:
      type: object
      properties:
        id: { type: string, example: bond-rate-shock }
        title: { type: string, example: 금리가 움직일 때 채권 가격 }
        question:
          type: string
          example: 금리가 1%p 오르면 내 채권은 얼마나 떨어질까?
        summary: { type: string }
        mechanism:
          type: string
          description: 계산식의 요약. 결과를 검증 가능하게 만들기 위해 노출한다.
        conceptSlugs:
          type: array
          items: { type: string }
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/SimulationInputField'
        randomised:
          type: boolean
          description: 난수 경로를 쓰는 시나리오인지. true면 화면에 seed 재추첨 버튼을 노출한다.
        notice: { type: string }

    SimulationRun:
      type: object
      properties:
        scenarioId: { type: string }
        title: { type: string }
        headline:
          type: string
          description: 숫자보다 해석을 먼저 읽게 하는 한 줄 결과
        metrics:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string, description: 포맷된 표시 문자열 }
              rawValue: { type: number, description: 비교·검증용 원값 }
              unit: { type: string, nullable: true }
              tone:
                type: string
                enum: [GOOD, BAD, NEUTRAL]
              note: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind:
                type: string
                enum: [line, bar, waterfall]
              unit: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    value: { type: number }
        tables:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              columns:
                type: array
                items: { type: string }
              rows:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    cells:
                      type: array
                      items: { type: string }
              note: { type: string }
        lessons:
          type: array
          items: { type: string }
          description: 입력값에 따라 문장이 달라지는 교훈
        assumptions:
          type: array
          items: { type: string }
          description: 계산에 사용한 가정. 결과를 예측으로 오인하지 않게 항상 노출한다.
        echo:
          type: object
          additionalProperties: { type: string }
          description: 명세 범위로 보정된 실제 적용 입력값
        seed:
          type: integer
          format: int64
        notice: { type: string }

# 고도화 API 메모
# - GET /assessments/availability: monthly-kst-v1 정책 상태와 다음 진단일
# - GET /assessments?page=0: 완료 이력 페이지
# - AssessmentResult.evidence: 당시 답변·ruleVersion·questionnaireVersion·reviewFlags
# - GET /learning/tree: 3단계 개념 트리 (59개 개념)
# - POST /learning/concepts/{slug}/quiz/grade: 서버 채점. 정답은 클라이언트로 내려가지 않는다.
# - POST /learning/simulations/{scenarioId}/run: 11개 모의투자 시나리오. seed 고정 시 결과 재현.
# - 학습 API는 로그인 없이 접근 가능하다 (docs/09: 재진단 제한과 무관하게 학습은 열려 있어야 한다).
